name: Scheduled Network Test & Sync

on:
  schedule:
    - cron: '45 18 * * *'   # 北京 02:45
    - cron: '45  6 * * *'   # 北京 14:45
    - cron: '45 12 * * *'   # 北京 20:45
  workflow_dispatch: # 保留该项，支持在网页上手动点击按钮触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行节点抓取与清洗脚本
        run: |
          python aggregator.py

      - name: 提交并推送最新节点
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add config.yaml
          if git diff --staged --quiet; then
            echo "节点无变化，无需提交"
          else
            git commit -m "自动更新: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
